name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.14'
      - name: Check tracked files for credentials and databases
        run: python scripts/check_sensitive_files.py
      - name: Check lockfile matches declared dependencies
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check installed dependency compatibility
        run: uv pip check
      - name: Run unit and integration tests
        run: uv run --no-sync pytest

  production:
    name: Production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      MONZO_REDIRECT_URI: https://ci.example.com/monzo-callback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.14'
      - name: Check lockfile matches declared dependencies
        run: uv lock --check
      - name: Install locked production dependencies
        run: uv sync --frozen --no-dev
      - name: Check installed dependency compatibility
        run: uv pip check
      - name: Generate temporary CI configuration
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import secrets
          from cryptography.fernet import Fernet

          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"DATABASE_URL=sqlite:///{os.environ['RUNNER_TEMP']}/ci.db\n")
              environment.write(f"JWT_SECRET_KEY={secrets.token_urlsafe(32)}\n")
              environment.write(f"TOKEN_ENCRYPTION_KEY={Fernet.generate_key().decode()}\n")
              environment.write(f"BFF_API_KEY={secrets.token_urlsafe(32)}\n")
          PY
      - name: Apply migrations to a fresh database
        run: uv run --no-sync alembic upgrade head
      - name: Check production startup and health
        run: |
          uv run --no-sync python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          with TestClient(app, base_url="https://ci.example.com") as client:
              response = client.get("/health")
              assert response.status_code == 200, response.status_code
              assert response.json() == {"message": "ok"}, response.json()
          PY
